{{- $fullname := include "gpulayer.fullname" . -}}
{{- if not .Values.existingTokenSecret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-tokens" $fullname) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}-tokens
  labels: {{- include "gpulayer.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  client-token: {{ index $existing.data "client-token" }}
  join-token: {{ index $existing.data "join-token" }}
  {{- else }}
  client-token: {{ printf "glc_%s" (randAlphaNum 43) | b64enc }}
  join-token: {{ printf "glj_%s" (randAlphaNum 43) | b64enc }}
  {{- end }}
{{- end }}
---
{{- $tlsName := printf "%s-tls" $fullname }}
{{- $existingTLS := lookup "v1" "Secret" .Release.Namespace $tlsName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  labels: {{- include "gpulayer.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existingTLS }}
  ca.crt: {{ index $existingTLS.data "ca.crt" }}
  tls.crt: {{ index $existingTLS.data "tls.crt" }}
  tls.key: {{ index $existingTLS.data "tls.key" }}
  {{- else }}
  {{- $host := include "gpulayer.serverHost" . }}
  {{- $names := concat (list $host (printf "%s-server" $fullname) (printf "%s.cluster.local" $host) "localhost") .Values.server.extraTLSNames }}
  {{- $ca := genCA "gpulayer-ca" 3650 }}
  {{- $cert := genSignedCert $host (list "127.0.0.1") $names 3650 $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  {{- end }}
