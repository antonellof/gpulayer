# Publish to PyPI when a GitHub release is published, with trusted publishing (OpenID Connect):
# no API token is stored. PyPI trusts this workflow file in this repository, running in the
# `pypi` environment (configure both on pypi.org, see docs/project/contributing.md).
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist and wheel
        run: uv build
      - name: Check the version matches the tag
        if: github.event_name == 'release'
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "v$version" = "${{ github.event.release.tag_name }}" \
            || { echo "tag ${{ github.event.release.tag_name }} != version $version"; exit 1; }
      - name: Smoke-test the wheel
        run: |
          uv venv /tmp/wheel-test
          uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
          /tmp/wheel-test/bin/gpulayer --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/gpulayer/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  images:
    # Container images for Docker and the Helm chart (deploy/kubernetes):
    #   ghcr.io/<owner>/gpulayer:<version>        slim: server and workers without PyTorch
    #   ghcr.io/<owner>/gpulayer:<version>-torch  CPU workers with PyTorch
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/gpulayer
          docker build -t "$image:$version" -t "$image:latest" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
          docker build -t "$image:$version-torch" -t "$image:torch" --build-arg EXTRAS=torch-cpu \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
          for tag in "$version" latest "$version-torch" torch; do docker push "$image:$tag"; done
