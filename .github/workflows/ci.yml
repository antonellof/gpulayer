name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only torch for the distributed tests)
        run: |
          # setup-uv with python-version already created and activated .venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[dev]' numpy
      - name: Lint
        run: uv run --no-sync ruff check src tests benchmarks && uv run --no-sync ruff format --check src tests benchmarks
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Tests (CPU only; CUDA and MPS tests skip themselves)
        run: uv run --no-sync pytest -q

  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh deploy/docker/smoke-test.sh
      - name: Install script, pip path (no uv)
        run: |
          GPULAYER_SOURCE="$PWD" GPULAYER_INSTALL_DIR="$RUNNER_TEMP/gl" GPULAYER_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/gpulayer" --version
          "$RUNNER_TEMP/bin/gpulayer" resources detect

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t gpulayer:ci .
      - name: Server, worker and a job across containers
        run: sh deploy/docker/smoke-test.sh gpulayer:ci

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (with CPU PyTorch)
        run: docker build -t gpulayer:ci --build-arg EXTRAS=torch-cpu .
      - uses: helm/kind-action@v1
        with:
          cluster_name: gpulayer
      - name: Install the Helm chart
        run: |
          helm lint deploy/kubernetes/helm/gpulayer
          kind load docker-image gpulayer:ci --name gpulayer
          helm install t deploy/kubernetes/helm/gpulayer --namespace gl --create-namespace \
            --set image.repository=gpulayer --set image.tag=ci --set image.pullPolicy=Never \
            --set workers.cpu.image.variant= \
            --set workers.cpu.resources.requests.cpu=250m \
            --set workers.cpu.resources.requests.memory=512Mi \
            --set server.resources.requests.cpu=100m \
            --wait --timeout 300s
      - name: Jobs and a distributed job across worker pods
        run: sh deploy/kubernetes/smoke-test.sh gl t
      - name: Upgrade keeps tokens; server restart keeps state
        run: |
          before=$(kubectl -n gl get secret t-gpulayer-tokens -o jsonpath='{.data.join-token}')
          helm upgrade t deploy/kubernetes/helm/gpulayer -n gl --reuse-values --wait --timeout 300s
          test "$before" = "$(kubectl -n gl get secret t-gpulayer-tokens -o jsonpath='{.data.join-token}')"
          kubectl -n gl delete pod t-gpulayer-server-0
          kubectl -n gl wait --for=condition=ready pod/t-gpulayer-server-0 --timeout=180s
          sh deploy/kubernetes/smoke-test.sh gl t
          test "$(kubectl -n gl exec t-gpulayer-server-0 -- gpulayer job list | grep -c succeeded)" -ge 4
      - name: Logs on failure
        if: failure()
        run: kubectl -n gl get pods -o wide; kubectl -n gl logs -l app.kubernetes.io/instance=t --all-containers --tail=100
