<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-label="Targets (local, remote, cloud) by workload type (independent, distributed): every combination is valid"><rect width="980" height="600" fill="#0a0a0a"/><text x="170" y="36" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9a9a9a" text-anchor="start">Target: where it runs</text><text x="28" y="104" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#9a9a9a" text-anchor="start">Workload: what runs</text><text x="297.5" y="74" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">Local</text><text x="297.5" y="96" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">workers on this machine</text><text x="570.5" y="74" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">Remote</text><text x="570.5" y="96" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">machines that joined your server</text><text x="843.5" y="74" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">Cloud</text><text x="843.5" y="96" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">machines a provider creates for the job</text><text x="28" y="206.0" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="start">Independent</