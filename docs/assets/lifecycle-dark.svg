<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" width="980" height="380" role="img" aria-label="Job states: queued, provisioning, scheduled, running, then succeeded, failed, timed out or cancelled; a lost worker sends the job back to the queue"><defs><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/></marker><marker id="h-rank" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bc8cff"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a9a9a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3fb950"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f85149"/></marker></defs><rect width="980" height="380" fill="#0a0a0a"/><rect x="14" y="30" width="774" height="228" rx="18" fill="#0a0a0a" stroke="#2a2a2a" stroke-width="1.5" stroke-dasharray="5 5"/><rect x="30" y="150" width="128" height="40" rx="20" fill="#0f2742" stroke="#58a6ff" stroke-width="1.5"/><text x="94.0" y="175" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">queued</text><rect x="190" y="50" width="128" height="40" rx="20" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/><text x="254.0" y="75" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">provisioning</text><rect x="370" y="150" width="128" height="40" rx="20" fill="#141414" stroke="#3a3a3a" stroke-width="1.5"/><text x="434.0" y="175" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">scheduled</text><rect x="610" y="150" width="128" height="40" rx="20" fill="#0f2742" stroke="#58a6ff" stroke-width="1.5"/><text x="674.0" y="175" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">running</text><path d="M158 170 L368 170" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#h-accent)"/><text x="263" y="162" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">placed on worker(s)</text><path d="M120 150 L200 92" fill="none" stroke="#9a9a9a" stroke-width="2" marker-end="url(#h-muted)"/><text x="96" y="106" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">needs cloud</text><text x="96" y="121" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">capacity</text><path d="M300 92 L395 150" fill="none" stroke="#9a9a9a" stroke-width="2" marker-end="url(#h-muted)"/><text x="372" y="106" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="start">a VM joined</text><path d="M498 170 L608 170" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#h-accent)"/><text x="553" y="162" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">started</text><path d="M660 191 Q377.0 251.0 94 191" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#h-muted)"/><text x="377" y="242" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">worker lost: back to the queue when retries are allowed</text><rect x="830" y="60" width="128" height="40" rx="20" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="894.0" y="85" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">succeeded</text><rect x="830" y="150" width="128" height="40" rx="20" fill="#2d1416" stroke="#f85149" stroke-width="1.5"/><text x="894.0" y="175" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">failed</text><rect x="830" y="240" width="128" height="40" rx="20" fill="#2d1416" stroke="#f85149" stroke-width="1.5"/><text x="894.0" y="265" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">timed_out</text><path d="M738 160 L828 84" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#h-ok)"/><path d="M738 170 L828 170" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#h-bad)"/><path d="M738 180 L828 256" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#h-bad)"/><path d="M60 192 L60 306" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#h-bad)"/><text x="72" y="324" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#f85149" text-anchor="start">failed: no worker could ever run it</text><rect x="420" y="312" width="128" height="40" rx="20" fill="#2d1416" stroke="#f85149" stroke-width="1.5"/><text x="484.0" y="337" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="13" font-weight="600" fill="#ededed" text-anchor="middle">cancelled</text><path d="M484 260 L484 310" fill="none" stroke="#f85149" stroke-width="2" marker-end="url(#h-bad)"/><text x="496" y="290" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="start">gpulayer job cancel, from any state above</text></svg>