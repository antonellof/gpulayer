<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-label="One distributed job: the control plane places a group of workers, node 0 publishes the rendezvous address, each node starts its ranks, ranks talk directly, logs and outputs come back per node"><defs><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/></marker><marker id="h-rank" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bc8cff"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a9a9a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3fb950"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f85149"/></marker></defs><rect width="980" height="640" fill="#0a0a0a"/><rect x="30" y="40" width="210" height="150" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><rect x="87" y="62" width="96" height="59.519999999999996" rx="7" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><path d="M77 124.52 h116 l-8 9 h-100 Z" fill="#3a3a3a"/><text x="135" y="150" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#ededed" text-anchor="middle">Trainer(num_nodes=2,</text><text x="135" y="168" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" font-weight="400" fill="#ededed" text-anchor="middle">devices=2)</text><rect x="380" y="40" width="300" height="150" rx="12" fill="#0f2742" stroke="#58a6ff" stroke-width="1.5"/><text x="530" y="80" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed" text-anchor="middle">Control plane</text><text x="530" y="108" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">queue, scheduler, logs, artifacts</text><path d="M240 115 L378 115" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#h-accent)"/><circle cx="309" cy="100" r="11" fill="#58a6ff"/><text x="309" y="104.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">1</text><rect x="210" y="300" width="300" height="160" rx="14" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1.5"/><rect x="228" y="320" width="70" height="50" rx="8" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><line x1="240" y1="334" x2="262" y2="334" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="348" x2="262" y2="348" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="362" x2="262" y2="362" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><text x="315" y="340" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="start">Node 0</text><text x="315" y="360" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="start">worker, hosts rank 0</text><rect x="232" y="392" width="118" height="30" rx="6" fill="#2a1d47" stroke="#bc8cff" stroke-width="1.6"/><text x="291.0" y="409" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="400" fill="#ededed" text-anchor="middle">rank 0</text><rect x="372" y="392" width="118" height="30" rx="6" fill="#2a1d47" stroke="#bc8cff" stroke-width="1.6"/><text x="431.0" y="409" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="400" fill="#ededed" text-anchor="middle">rank 1</text><text x="360" y="446" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">RANK, LOCAL_RANK, WORLD_SIZE=4</text><rect x="560" y="300" width="300" height="160" rx="14" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1.5"/><rect x="578" y="320" width="70" height="50" rx="8" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><line x1="590" y1="334" x2="612" y2="334" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="590" y1="348" x2="612" y2="348" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="590" y1="362" x2="612" y2="362" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><text x="665" y="340" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="start">Node 1</text><text x="665" y="360" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="start">worker</text><rect x="582" y="392" width="118" height="30" rx="6" fill="#2a1d47" stroke="#bc8cff" stroke-width="1.6"/><text x="641.0" y="409" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="400" fill="#ededed" text-anchor="middle">rank 2</text><rect x="722" y="392" width="118" height="30" rx="6" fill="#2a1d47" stroke="#bc8cff" stroke-width="1.6"/><text x="781.0" y="409" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11.5" font-weight="400" fill="#ededed" text-anchor="middle">rank 3</text><text x="710" y="446" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">RANK, LOCAL_RANK, WORLD_SIZE=4</text><path d="M470 192 L380 298" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#h-accent)"/><circle cx="425" cy="245" r="11" fill="#58a6ff"/><text x="425" y="249.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">2</text><path d="M600 192 L690 298" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#h-accent)"/><circle cx="645" cy="245" r="11" fill="#58a6ff"/><text x="645" y="249.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">3</text><path d="M512 407 L578 407" fill="none" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#h-rank)" marker-start="url(#h-rank)"/><circle cx="545" cy="385" r="11" fill="#58a6ff"/><text x="545" y="389.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">4</text><path d="M862 300 Q772.5 195.0 683 150" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#h-muted)"/><circle cx="805" cy="205" r="11" fill="#58a6ff"/><text x="805" y="209.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">5</text><circle cx="46" cy="496" r="11" fill="#58a6ff"/><text x="46" y="500.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">1</text><text x="66" y="500" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">The Trainer submits one DistributedJob: 2 nodes x 2 processes.</text><circle cx="46" cy="522" r="11" fill="#58a6ff"/><text x="46" y="526.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">2</text><text x="66" y="526" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">The control plane places both workers at once (same torch, close together); node 0 picks a port and publishes address:port.</text><circle cx="46" cy="548" r="11" fill="#58a6ff"/><text x="46" y="552.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">3</text><text x="66" y="552" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">Node 1 gets its assignment after that; each node starts its ranks with torchrun's environment.</text><circle cx="46" cy="574" r="11" fill="#58a6ff"/><text x="46" y="578.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">4</text><text x="66" y="578" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">Ranks talk directly: NCCL on GPUs, gloo on CPUs, rendezvous at MASTER_ADDR on node 0.</text><circle cx="46" cy="600" r="11" fill="#58a6ff"/><text x="46" y="604.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0a0a0a" text-anchor="middle">5</text><text x="66" y="604" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">Logs come back tagged by node and outputs as node0/ and node1/; the first failing node stops the job.</text></svg>