<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" role="img" aria-label="A GPUlayer server: your laptop and joined machines connect to the machine running gpulayer up over HTTPS with a pinned certificate"><defs><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/></marker><marker id="head-rank" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bc8cff"/></marker></defs><rect width="980" height="490" fill="#0a0a0a"/><rect x="30" y="150" width="200" height="170" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><rect x="82" y="178" width="96" height="59.519999999999996" rx="7" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><path d="M72 240.51999999999998 h116 l-8 9 h-100 Z" fill="#3a3a3a"/><text x="130" y="270" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed" text-anchor="middle">Your laptop</text><text x="130" y="292" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">Trainer, launch(), CLI</text><rect x="330" y="40" width="330" height="390" rx="16" fill="#0a0a0a" stroke="#3a3a3a" stroke-width="1.5"/><text x="495" y="70" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Machine running gpulayer up</text><text x="495" y="90" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">port 8470, TLS</text><rect x="355" y="110" width="280" height="120" rx="12" fill="#0f2742" stroke="#58a6ff" stroke-width="1.5"/><text x="495" y="145" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#ededed" text-anchor="middle">Control plane</text><text x="495" y="170" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">queue and scheduler</text><text x="495" y="190" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">tokens, artifacts, logs</text><rect x="355" y="290" width="280" height="115" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><rect x="375" y="318" width="80" height="60" rx="8" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><line x1="387" y1="332" x2="409" y2="332" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="387" y1="346" x2="409" y2="346" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="387" y1="360" x2="409" y2="360" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><text x="550" y="342" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Worker</text><text x="550" y="364" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">this machine's GPUs</text><line x1="495" y1="290" x2="495" y2="232" stroke="#58a6ff" stroke-width="2" marker-end="url(#head-accent)"/><rect x="760" y="60" width="190" height="150" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><rect x="807" y="82" width="96" height="64" rx="8" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><line x1="819" y1="96" x2="841" y2="96" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="819" y1="110" x2="841" y2="110" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="819" y1="124" x2="841" y2="124" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><text x="855" y="172" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">GPU server</text><text x="855" y="192" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">gpulayer join</text><rect x="760" y="265" width="190" height="150" rx="12" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><rect x="807" y="292" width="96" height="64" rx="8" fill="#1b1b1b" stroke="#3a3a3a" stroke-width="2"/><line x1="819" y1="306" x2="841" y2="306" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="819" y1="320" x2="841" y2="320" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><line x1="819" y1="334" x2="841" y2="334" stroke="#3a3a3a" stroke-width="3" stroke-linecap="round"/><g transform="translate(873 274) scale(1.4)"><path d="M17.5 19H7a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.4 9.6 4.75 4.75 0 0 1 17.5 19Z" fill="#0a0a0a" stroke="#9a9a9a" stroke-width="1.6" stroke-linejoin="round"/></g><text x="855" y="378" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Cloud VM</text><text x="855" y="398" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#9a9a9a" text-anchor="middle">gpulayer join</text><line x1="230" y1="200" x2="353" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#head-accent)"/><line x1="760" y1="135" x2="637" y2="155" stroke="#58a6ff" stroke-width="2" marker-end="url(#head-accent)"/><line x1="760" y1="340" x2="637" y2="205" stroke="#58a6ff" stroke-width="2" marker-end="url(#head-accent)"/><text x="280" y="160" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">HTTPS,</text><text x="280" y="175" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">pinned cert</text><text x="700" y="118" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">HTTPS,</text><text x="700" y="133" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="middle">pinned cert</text><line x1="905" y1="212" x2="905" y2="263" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#head-rank)" marker-start="url(#head-rank)"/><text x="918" y="242" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9a9a9a" text-anchor="start">ranks</text><text x="490.0" y="460" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="middle">Every machine opens its own connection to the server, so workers can sit behind NAT.</text><text x="490.0" y="478" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#9a9a9a" text-anchor="middle">Ranks of one distributed job also connect to each other directly.</text></svg>