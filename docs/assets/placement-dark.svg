<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="How the scheduler places a job: compatible workers, then available ones, then the closest group, then the best-connected GPUs"><defs><marker id="h-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/></marker><marker id="h-rank" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#bc8cff"/></marker><marker id="h-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#9a9a9a"/></marker><marker id="h-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3fb950"/></marker><marker id="h-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#f85149"/></marker></defs><rect width="980" height="470" fill="#0a0a0a"/><text x="135" y="40" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Job asks for</text><text x="375" y="40" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Compatible</text><text x="605" y="40" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Available now</text><text x="835" y="40" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">Closest group</text><rect x="30" y="60" width="210" height="300" rx="12" fill="#0f2742" stroke="#58a6ff" stroke-width="1.5"/><text x="46" y="96" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">accelerator: cuda</text><text x="46" y="136" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">devices: 2 per node</text><text x="46" y="176" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">num_nodes: 2</text><text x="46" y="216" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">GPU memory &gt;= 16 GB</text><text x="46" y="256" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">torch, the job's packages</text><text x="46" y="296" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12.5" font-weight="400" fill="#ededed" text-anchor="start">group_locality: prefer</text><rect x="270" y="64" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="284" y="84" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-1</text><text x="284" y="101" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone b</text><rect x="500" y="64" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="514" y="84" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-1</text><text x="514" y="101" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone b</text><rect x="730" y="64" width="210" height="46" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="744" y="84" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-1</text><text x="744" y="101" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone b</text><rect x="270" y="122" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="284" y="142" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-2</text><text x="284" y="159" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone b</text><rect x="500" y="122" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="514" y="142" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-2</text><text x="514" y="159" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone b</text><rect x="730" y="122" width="210" height="46" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="1.5"/><text x="744" y="142" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-2</text><text x="744" y="159" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone b</text><rect x="270" y="180" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="284" y="200" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">t4-1</text><text x="284" y="217" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone c</text><rect x="500" y="180" width="210" height="46" rx="10" fill="#2d1416" stroke="#f85149" stroke-width="1.5"/><text x="514" y="200" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">t4-1</text><text x="514" y="217" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone c</text><text x="696" y="209" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f85149" text-anchor="end">busy: no free slot</text><rect x="270" y="238" width="210" height="46" rx="10" fill="#2d1416" stroke="#f85149" stroke-width="1.5"/><text x="284" y="258" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">mac</text><text x="284" y="275" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">home</text><text x="466" y="267" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f85149" text-anchor="end">no CUDA device</text><rect x="270" y="296" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="284" y="316" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-3</text><text x="284" y="333" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone c</text><rect x="500" y="296" width="210" height="46" rx="10" fill="#141414" stroke="#2a2a2a" stroke-width="1.5"/><text x="514" y="316" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-3</text><text x="514" y="333" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone c</text><rect x="730" y="296" width="210" height="46" rx="10" fill="#2d1416" stroke="#f85149" stroke-width="1.5"/><text x="744" y="316" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ededed" text-anchor="start">a100-3</text><text x="744" y="333" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#9a9a9a" text-anchor="start">zone c</text><text x="926" y="325" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#f85149" text-anchor="end">farther: other zone</text><path d="M234 35 L270 35" fill="none" stroke="#9a9a9a" stroke-width="2" marker-end="url(#h-muted)"/><path d="M464 35 L500 35" fill="none" stroke="#9a9a9a" stroke-width="2" marker-end="url(#h-muted)"/><path d="M694 35 L730 35" fill="none" stroke="#9a9a9a" stroke-width="2" marker-end="url(#h-muted)"/><text x="30" y="390.0" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="start">Every rejected worker gets its reason (gpulayer job status shows them). A job waits for busy workers</text><text x="30" y="407.5" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="start">and fails at once only when no worker could ever run it. Inside each chosen machine the 2 processes</text><text x="30" y="425.0" font-family="Geist, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9a9a9a" text-anchor="start">get the best-connected GPU pair (NVLink before PCIe), so DDP's all-reduce takes the fastest path.</text></svg>