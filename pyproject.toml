[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "gpulayer"
version = "0.1.0.dev0"
description = "Open-source GPU execution and orchestration across local, remote, cloud and distributed compute."
readme = "README.md"
requires-python = ">=3.10"
# License intentionally not declared yet: see docs/decisions/ADR-0012 (Proposed).
dependencies = [
  "pydantic>=2.5,<3",
  "packaging>=23",
]

[project.optional-dependencies]
# Optional runtime used for MPS/CUDA probing and torchrun-based distributed jobs.
# GpuLayer itself never imports torch in the worker process; it probes it in a subprocess.
torch = ["torch>=2.1"]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
gpulayer = "gpulayer.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpulayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/integration"]
markers = [
  "integration: real local processes / sockets on one machine",
  "distributed: real multi-process torch.distributed run (requires torch)",
  "hardware_cuda: requires an NVIDIA GPU with a working CUDA runtime",
  "hardware_mps: requires Apple Silicon with PyTorch MPS available",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
