[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gpulayer"
version = "0.2.0"
description = "Run any workload on every GPU and CPU you can reach: job orchestration across local, remote and cloud machines, distributed PyTorch, a web dashboard and an MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Antonello" }]
keywords = ["gpu", "cuda", "pytorch", "distributed", "orchestration", "scheduler", "mlops", "apple-silicon", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "pydantic>=2.5,<3",
  "packaging>=23",
]

[project.optional-dependencies]
# Optional runtime used for MPS/CUDA probing and torchrun-based distributed jobs.
# GPUlayer itself never imports torch in the worker process; it probes it in a subprocess.
torch = ["torch>=2.1"]
# Everything the examples/ directory uses.
examples = [
  "torch>=2.1",
  "numpy>=1.20",
  "mlx>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = ["pytest>=7.4", "ruff>=0.4", "mypy>=1.8", "prometheus-client>=0.20"]

[project.scripts]
gpulayer = "gpulayer.cli.main:main"

[project.urls]
Homepage = "https://www.gpulayer.dev"
Documentation = "https://www.gpulayer.dev/docs/"
Source = "https://github.com/antonellof/gpulayer"
Changelog = "https://github.com/antonellof/gpulayer/blob/main/CHANGELOG.md"
Issues = "https://github.com/antonellof/gpulayer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gpulayer"]

# The source distribution carries the Python project only (not the website or its builds).
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/benchmarks",
  "/docs",
  "/deploy",
  "/integrations",
  "/install.sh",
  "/README.md",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/integration"]
markers = [
  "integration: real local processes / sockets on one machine",
  "distributed: real multi-process torch.distributed run (requires torch)",
  "hardware_cuda: requires an NVIDIA GPU with a working CUDA runtime",
  "hardware_mps: requires Apple Silicon with PyTorch MPS available",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
